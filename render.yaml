# Free trial: the PostgreSQL database expires after 30 days.
services:
  - type: web
    name: reconcileiq
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: reconcileiq-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: reconcileiq-db
    region: singapore
    plan: free
    diskSizeGB: 1
    databaseName: reconcileiq
    ipAllowList: []
