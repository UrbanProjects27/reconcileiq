[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.14.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg", "serverless-http", "@azure/msal-node"]

# The modern-function tracer leaves the legacy HTTP adapter's require() calls
# external. Include only these production packages and their transitive deps.
[functions.api]
  included_files = [
    "node_modules/serverless-http/**",
    "node_modules/pg*/**",
    "node_modules/postgres-*/**",
    "node_modules/split2/**",
    "node_modules/xtend/**",
    "node_modules/@azure/msal-node/**",
    "node_modules/@azure/msal-common/**",
    "node_modules/jsonwebtoken/**",
    "node_modules/jws/**",
    "node_modules/jwa/**",
    "node_modules/lodash.*/**",
    "node_modules/ms/**",
    "node_modules/semver/**",
    "node_modules/safe-buffer/**",
    "node_modules/buffer-equal-constant-time/**",
    "node_modules/ecdsa-sig-formatter/**"
  ]

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
